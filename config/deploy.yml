# config/deploy.yml
# Salato Events
# Rails 8 + PostgreSQL 16 + Redis 7 + Sidekiq + Kamal 2
# Production server: Contabo VPS

service: salato-events

image: ger619/salato-events

# --------------------------------------------------
# Production servers
#
# web    -> Puma, behind the Kamal proxy
# worker -> Sidekiq, same image, different command
# --------------------------------------------------

servers:
  web:
    - 207.180.216.54

  worker:
    hosts:
      - 207.180.216.54
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Give Rails/Kamal enough time for the first boot,
# PostgreSQL startup and database preparation.
deploy_timeout: 120

# --------------------------------------------------
# Proxy / Domain
# --------------------------------------------------

proxy:
  ssl: true

  host:
    salato.app

  healthcheck:
    path: /up
    interval: 3
    timeout: 10

# --------------------------------------------------
# Container Registry
# --------------------------------------------------

registry:
  server: ghcr.io

  username: ger619

  password:
    - KAMAL_REGISTRY_PASSWORD

# --------------------------------------------------
# Docker Build
# --------------------------------------------------

builder:
  arch: amd64

# --------------------------------------------------
# Application Environment
# --------------------------------------------------

env:

  clear:
    RAILS_ENV: production

    # ------------------------------------------------
    # PostgreSQL connection
    #
    # database.yml reads PGHOST/PGPORT/PGUSER/PGPASSWORD.
    #
    # The PostgreSQL Kamal accessory is named "db".
    # Kamal therefore creates the service as:
    #
    # salato-events-db
    # ------------------------------------------------

    PGHOST: salato-events-db
    PGPORT: "5432"

    PGUSER: salato

    PG_DATABASE: salato_events_production
    PG_CACHE_DATABASE: salato_events_production_cache
    PG_CABLE_DATABASE: salato_events_production_cable

    # ------------------------------------------------
    # Redis / Sidekiq
    #
    # The Redis Kamal accessory is named "redis",
    # so the service on the Kamal network is:
    #
    # salato-events-redis
    # ------------------------------------------------

    REDIS_URL: redis://salato-events-redis:6379/0

    SIDEKIQ_CONCURRENCY: "5"

    RAILS_LOG_TO_STDOUT: "true"

    # ------------------------------------------------
    # Email
    #
    # Mail is sent through Resend over SMTP. The domain
    # salato.app is verified in Resend, so the From
    # address must stay on that domain or Resend will
    # reject the message.
    # ------------------------------------------------

    MAIL_FROM: "Salato <hello@salato.app>"

  secret:
    - RAILS_MASTER_KEY
    - PGPASSWORD
    - SALATO_DATABASE_PASSWORD
    - PAYSTACK_SECRET_KEY
    - PAYSTACK_PUBLIC_KEY
    - PAYSTACK_CURRENCY

    # Resend API key — used as the SMTP password in
    # config/environments/production.rb.
    - RESEND_API_KEY

# --------------------------------------------------
# Persistent Rails Storage
# --------------------------------------------------

volumes:
  - "salato_storage:/rails/storage"

# --------------------------------------------------
# Rails Assets
# --------------------------------------------------

asset_path: /rails/public/assets

# --------------------------------------------------
# Accessories
# --------------------------------------------------

accessories:

  # ------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------

  db:

    image: postgres:16

    # PostgreSQL runs on the same Contabo server.
    host: 207.180.216.54

    # Bind PostgreSQL only to localhost on the VPS.
    #
    # IMPORTANT:
    # Do NOT expose PostgreSQL publicly.
    #
    # Rails connects to the PostgreSQL container through
    # the Kamal Docker network using:
    #
    # salato-events-db:5432
    #
    port: "127.0.0.1:5432:5432"

    env:

      clear:
        POSTGRES_USER: salato
        POSTGRES_DB: salato_events_production

      secret:
        - POSTGRES_PASSWORD

    directories:
      - data:/var/lib/postgresql/data

  # ------------------------------------------------
  # Redis (Sidekiq queue backend)
  # ------------------------------------------------

  redis:

    image: redis:7-alpine

    # Redis runs on the same Contabo server.
    host: 207.180.216.54

    # Bind Redis only to localhost on the VPS.
    #
    # IMPORTANT:
    # Do NOT expose Redis publicly — it has no auth here
    # and relies on being unreachable from outside.
    #
    # Rails and Sidekiq connect through the Kamal Docker
    # network using:
    #
    # salato-events-redis:6379
    #
    port: "127.0.0.1:6379:6379"

    # noeviction is required for Sidekiq: the default policy
    # would silently discard queued jobs under memory pressure.
    # appendonly keeps the queue across restarts.
    cmd: "redis-server --appendonly yes --maxmemory-policy noeviction"

    directories:
      - data:/data