# config/deploy.yml
# Salato Events
# Rails 8 + PostgreSQL 16 + Redis 7 + Sidekiq + OpenWA + Kamal 2
# Production server: Contabo VPS

service: salato-events

image: ger619/salato-events

# --------------------------------------------------
# Production servers
#
# web    -> Puma, behind the Kamal proxy
# worker -> Sidekiq, same image, different command
# --------------------------------------------------

servers:
  web:
    - 207.180.216.54

  worker:
    hosts:
      - 207.180.216.54
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Give Rails/Kamal enough time for the first boot,
# PostgreSQL startup and database preparation.
deploy_timeout: 120

# --------------------------------------------------
# Proxy / Domain
# --------------------------------------------------

proxy:
  ssl: true

  host:
    salato.app

  healthcheck:
    path: /up
    interval: 3
    timeout: 10

# --------------------------------------------------
# Container Registry
# --------------------------------------------------

registry:
  server: ghcr.io

  username: ger619

  password:
    - KAMAL_REGISTRY_PASSWORD

# --------------------------------------------------
# Docker Build
# --------------------------------------------------

builder:
  arch: amd64

# --------------------------------------------------
# Application Environment
# --------------------------------------------------

env:

  clear:
    RAILS_ENV: production

    # ------------------------------------------------
    # PostgreSQL connection
    #
    # database.yml reads PGHOST/PGPORT/PGUSER/PGPASSWORD.
    #
    # The PostgreSQL Kamal accessory is named "db".
    # Kamal therefore creates the service as:
    #
    # salato-events-db
    # ------------------------------------------------

    PGHOST: salato-events-db
    PGPORT: "5432"

    PGUSER: salato

    PG_DATABASE: salato_events_production
    PG_CACHE_DATABASE: salato_events_production_cache
    PG_CABLE_DATABASE: salato_events_production_cable

    # ------------------------------------------------
    # Redis / Sidekiq
    #
    # The Redis Kamal accessory is named "redis",
    # so the service on the Kamal network is:
    #
    # salato-events-redis
    # ------------------------------------------------

    REDIS_URL: redis://salato-events-redis:6379/0

    SIDEKIQ_CONCURRENCY: "5"

    RAILS_LOG_TO_STDOUT: "true"

    # ------------------------------------------------
    # Email
    #
    # Mail is sent through Resend over SMTP. The domain
    # salato.app is verified in Resend, so the From
    # address must stay on that domain or Resend will
    # reject the message.
    # ------------------------------------------------

    MAIL_FROM: "Salato <hello@salato.app>"

    # ------------------------------------------------
    # WhatsApp ticket delivery
    #
    # WhatsappTicketDeliveryJob posts the ticket PDF to
    # the OpenWA gateway once Paystack confirms payment.
    #
    # The OpenWA Kamal accessory is named "openwa", so
    # the service on the Kamal network is:
    #
    # salato-events-openwa
    #
    # Rails uses that internal name, NOT wa.salato.app:
    # the PDF upload stays inside the Docker network and
    # never crosses the public proxy.
    #
    # The dashboard is published at https://wa.salato.app
    # for QR pairing and session health — see accessories.
    # ------------------------------------------------

    OPENWA_BASE_URL: http://salato.app:2785

    # The UUID returned by POST /api/sessions during first
    # setup — NOT the session name. Passing the name gets
    # a 400 "session is not active".
    #
    # The gateway has to be booted and a session created
    # before this value exists, so adding WhatsApp is a
    # two-step deploy: boot the accessory, create and link
    # the session, fill this in, deploy again.
    OPENWA_SESSION_ID: ""

  secret:
    - RAILS_MASTER_KEY
    - PGPASSWORD
    - SALATO_DATABASE_PASSWORD
    - PAYSTACK_SECRET_KEY
    - PAYSTACK_PUBLIC_KEY
    - PAYSTACK_CURRENCY

    # Resend API key — used as the SMTP password in
    # config/environments/production.rb.
    - RESEND_API_KEY

    # OpenWA key, sent by Rails as the X-API-Key header.
    # .kamal/secrets exports one value under two names so
    # Rails and the gateway can never drift apart.
    - OPENWA_API_KEY

# --------------------------------------------------
# Persistent Rails Storage
# --------------------------------------------------

volumes:
  - "salato_storage:/rails/storage"

# --------------------------------------------------
# Rails Assets
# --------------------------------------------------

asset_path: /rails/public/assets

# --------------------------------------------------
# Accessories
# --------------------------------------------------

accessories:

  # ------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------

  db:

    image: postgres:16

    # PostgreSQL runs on the same Contabo server.
    host: 207.180.216.54

    # Bind PostgreSQL only to localhost on the VPS.
    #
    # IMPORTANT:
    # Do NOT expose PostgreSQL publicly.
    #
    # Rails connects to the PostgreSQL container through
    # the Kamal Docker network using:
    #
    # salato-events-db:5432
    #
    port: "127.0.0.1:5432:5432"

    env:

      clear:
        POSTGRES_USER: salato
        POSTGRES_DB: salato_events_production

      secret:
        - POSTGRES_PASSWORD

    directories:
      - data:/var/lib/postgresql/data

  # ------------------------------------------------
  # Redis (Sidekiq queue backend)
  # ------------------------------------------------

  redis:

    image: redis:7-alpine

    # Redis runs on the same Contabo server.
    host: 207.180.216.54

    # Bind Redis only to localhost on the VPS.
    #
    # IMPORTANT:
    # Do NOT expose Redis publicly — it has no auth here
    # and relies on being unreachable from outside.
    #
    # Rails and Sidekiq connect through the Kamal Docker
    # network using:
    #
    # salato-events-redis:6379
    #
    port: "127.0.0.1:6379:6379"

    # noeviction is required for Sidekiq: the default policy
    # would silently discard queued jobs under memory pressure.
    # appendonly keeps the queue across restarts.
    cmd: "redis-server --appendonly yes --maxmemory-policy noeviction"

    directories:
      - data:/data

  # ------------------------------------------------
  # OpenWA (WhatsApp gateway)
  #
  # Self-hosted WhatsApp HTTP API. Delivers ticket PDFs
  # to order.customer_phone once payment clears.
  #
  # Unlike db and redis this one IS published, because
  # linking a WhatsApp number means scanning a QR code in
  # a browser, and a session that drops has to be re-paired
  # the same way. Reaching that only through an SSH tunnel
  # is how a dead session goes unnoticed for a day.
  #
  # What protects it:
  #
  #   - TLS on wa.salato.app, issued by kamal-proxy
  #   - every API route requires the X-API-Key header
  #   - Swagger stays off
  #
  # Before go-live, mint a session-scoped operator key in
  # the dashboard for Rails and keep the admin key for
  # yourself. OpenWA also supports CIDR IP whitelisting per
  # key — worth adding once the VPS is the only thing that
  # ever calls the API.
  # ------------------------------------------------

  openwa:

    image: rmyndharis/openwa:latest

    # Runs on the same Contabo server.
    host: 207.180.216.54

    # Published through kamal-proxy on its own subdomain.
    #
    # DNS: add an A record for wa -> 207.180.216.54 at
    # Cloudflare and leave it DNS-only (grey cloud) until
    # the Let's Encrypt certificate is issued, or the
    # HTTP-01 challenge is answered by Cloudflare instead
    # of kamal-proxy and issuance never completes.
    proxy:
      ssl: true
      host: wa.salato.app

      # kamal-proxy talks to containers on port 80 by
      # default. OpenWA serves the API and the bundled
      # dashboard together on 2785.
      app_port: 2785

      # Public, unauthenticated liveness endpoint.
      healthcheck:
        path: /api/health
        interval: 5
        timeout: 10

    env:

      clear:
        # whatsapp-web.js drives a headless Chromium, which
        # costs several hundred MB of RAM on a box already
        # running Postgres, Redis, Puma and Sidekiq. If the
        # VPS starts swapping, switch this to "baileys":
        # browserless WebSocket engine, same REST API.
        ENGINE_TYPE: whatsapp-web.js

        # Interactive API docs stay off in production. The
        # published image already defaults to off; this is
        # explicit so nobody turns it on by accident.
        ENABLE_SWAGGER: "false"

      secret:
        # Seeds the gateway's admin key instead of letting
        # it generate a random one into /app/data/.api-key.
        - API_MASTER_KEY

    # SQLite database, linked-session credentials, media and
    # the API key all live here. Lose this volume and the
    # number has to be re-paired from the QR code.
    directories:
      - data:/app/data