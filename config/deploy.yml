# config/deploy.yml
# Salato Events
# Rails 8 + PostgreSQL 16 + Kamal 2
# Production server: Contabo VPS

service: salato-events

image: ger619/salato-events

# --------------------------------------------------
# Production server
# --------------------------------------------------

servers:
  web:
    - 207.180.216.54

# Give Rails/Kamal enough time for the first boot,
# PostgreSQL startup and database preparation.
deploy_timeout: 120

# --------------------------------------------------
# Proxy / Domain
# --------------------------------------------------

proxy:
  ssl: true

  host:
    salato.app

  healthcheck:
    path: /up
    interval: 3
    timeout: 10

# --------------------------------------------------
# Container Registry
# --------------------------------------------------

registry:
  server: ghcr.io

  username: ger619

  password:
    - KAMAL_REGISTRY_PASSWORD

# --------------------------------------------------
# Docker Build
# --------------------------------------------------

builder:
  arch: amd64

# --------------------------------------------------
# Application Environment
# --------------------------------------------------

env:

  clear:
    RAILS_ENV: production

    # ------------------------------------------------
    # PostgreSQL connection
    #
    # database.yml reads PGHOST/PGPORT/PGUSER/PGPASSWORD.
    #
    # The PostgreSQL Kamal accessory is named "db".
    # Kamal therefore creates the service as:
    #
    # salato-events-db
    # ------------------------------------------------

    PGHOST: salato-events-db
    PGPORT: "5432"

    PGUSER: salato

    PG_DATABASE: salato_events_production
    PG_QUEUE_DATABASE: salato_events_production_queue
    PG_CACHE_DATABASE: salato_events_production_cache
    PG_CABLE_DATABASE: salato_events_production_cable

    # ------------------------------------------------
    # Rails / Solid
    # ------------------------------------------------

    SOLID_QUEUE_IN_PUMA: "true"

    RAILS_LOG_TO_STDOUT: "true"

  secret:
    - RAILS_MASTER_KEY
    - PGPASSWORD
    - PAYSTACK_SECRET_KEY
    - PAYSTACK_PUBLIC_KEY
    - PAYSTACK_CURRENCY

# --------------------------------------------------
# Persistent Rails Storage
# --------------------------------------------------

volumes:
  - "salato_storage:/rails/storage"

# --------------------------------------------------
# Rails Assets
# --------------------------------------------------

asset_path: /rails/public/assets

# --------------------------------------------------
# PostgreSQL Accessory
# --------------------------------------------------

accessories:

  db:

    image: postgres:16

    # PostgreSQL runs on the same Contabo server.
    host: 207.180.216.54

    # Bind PostgreSQL only to localhost on the VPS.
    #
    # IMPORTANT:
    # Do NOT expose PostgreSQL publicly.
    #
    # Rails connects to the PostgreSQL container through
    # the Kamal Docker network using:
    #
    # salato-events-db:5432
    #
    port: "127.0.0.1:5432:5432"

    env:

      clear:
        POSTGRES_USER: salato
        POSTGRES_DB: salato_events_production

      secret:
        - POSTGRES_PASSWORD

    directories:
      - data:/var/lib/postgresql/data
