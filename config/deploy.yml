# config/deploy.yml
# Salato — deployment to Contabo VPS 207.180.216.54

service: salato-events
image: ger619/salato-events

servers:
  web:
    - 207.180.216.54

proxy:
  ssl: true
  hosts:
    - salato.events
    - www.salato.events
  # First boot runs migrations, so give the container room before
  # the proxy declares it unhealthy. The 30s default is too tight.
  healthcheck:
    path: /up
    interval: 3
    timeout: 90

registry:
  server: ghcr.io
  username: ger619
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    DB_HOST: salato-events-db
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_TO_STDOUT: true
  secret:
    # NOTE: this must hold the value of config/credentials/production.key,
    # NOT config/master.key. See .kamal/secrets for why.
    - RAILS_MASTER_KEY
    - SALATO_DATABASE_PASSWORD

volumes:
  - "salato_storage:/rails/storage"

asset_path: /rails/public/assets

accessories:
  db:
    image: postgres:16
    host: 207.180.216.54
    # Bound to loopback so Postgres is NOT exposed to the internet.
    # Do not change this to a bare "5432".
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: salato
        POSTGRES_DB: salato_events_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data