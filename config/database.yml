# Rails database configuration
# Uses DATABASE_URL if present; otherwise falls back to PG* env vars.

default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV['DATABASE_URL'] if ENV['DATABASE_URL'].present? %>
  username: <%= ENV['PGUSER'].presence || ENV['DB_USER'].presence || '' %>
  password: <%= ENV['SALATO_DATABASE_PASSWORD'].presence || ENV['POSTGRES_PASSWORD'].presence || ENV['PGPASSWORD'].presence %>
  host: <%= ENV['DB_HOST'].presence || ENV['PGHOST'].presence || 'localhost' %>
  port: <%= ENV['DB_PORT'].presence || ENV['PGPORT'].presence || '5432' %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>


development:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || 'salato_development' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'salato_development' %>
  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_DATABASE'] || ENV['PG_DATABASE'] || 'salato_development' %>


test:
  primary:
    <<: *default
    database: <%= ENV['PG_TEST_DATABASE'] || 'salato_test' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'salato_test' %>

  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'salato_test' %>

  cable:
    <<: *default
    database: <%= ENV['PG_CABLE_TEST_DATABASE'] || ENV['PG_TEST_DATABASE'] || 'salato_test' %>



production:
  primary:
    <<: *default
    database: <%= ENV['PG_DATABASE'] || ENV['DB_NAME'] || 'salato_events_production' %>

  queue:
    <<: *default
    database: <%= ENV['PG_QUEUE_DATABASE'] || ENV['PG_DATABASE'] || 'salato_events_production' %>

  cache:
    <<: *default
    database: <%= ENV['PG_CACHE_DATABASE'] || ENV['PG_DATABASE'] || 'salato_events_production' %>

  cable:
    <<: *default
    database: <%= ENV['PG_CABLE_DATABASE'] || ENV['PG_DATABASE'] || 'salato_events_production' %>
